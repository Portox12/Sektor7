<body>
  <canvas id="leinwand"></canvas>
  <div id="koernung" aria-hidden="true"></div>

  <div id="hud" hidden>
    <div id="xp"><div id="xp-fuellung"></div></div>
    <div class="hud-reihe">
      <div id="hud-stufe" class="panel gelb">1</div>
      <div id="hud-zeit" class="panel orange">05:00</div>
      <div class="rechts">
        <div class="panel dunkel zaehler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 5 0 1 0 16 0a8 5 0 1 0-16 0M16 9l5-3M16 15l5 3"/></svg><span id="hud-besiegt">0</span></div>
        <div id="hud-zuschauer" class="panel dunkel zaehler" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>0</span></div>
        <button id="pause-knopf" class="panel dunkel" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg></button>
      </div>
    </div>
    <div id="hud-waffen" aria-hidden="true"></div>
  </div>

  <div id="boss-leiste" hidden><span></span><div><i></i></div></div>
  <div id="warnung" aria-live="assertive"></div>
  <div id="hinweis" hidden></div>
  <div id="schaden"></div>
  <div id="joystick" hidden><div></div></div>
  <div id="zielstick" hidden><div></div></div>
  <div id="zuschau-hud" hidden></div>
  <div id="schirm" hidden></div>

  <noscript>Dieses Spiel braucht JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
